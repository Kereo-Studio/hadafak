name: Remote Deploy HADAFAK Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'hadafak-backend/**' 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./hadafak-backend
          file: ./hadafak-backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hadafak-backend:latest

  deploy-to-laptop:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "192.168.10.100"
          username: "houmani"
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /opt/deployment/hadafak-backend
            cd /opt/deployment/hadafak-backend
            
            # Create the docker-compose file dynamically
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              hadafak-backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/hadafak-backend:latest
                container_name: hadafak-backend
                restart: unless-stopped
                env_file:
                  - .env # <-- Securely loads your pre-configured local env variables
                networks:
                  - proxy-tier
            networks:
              proxy-tier:
                external: true
            EOF

            # Pull and restart the container seamlessly
            docker compose pull
            docker compose up -d --remove-orphans